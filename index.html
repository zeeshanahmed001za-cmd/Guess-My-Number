<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Number guessing Game</title>
  </head>

  <body>
    <main class="gameContainer">
      <input
        type="number"
        id="guessInput"
        placeholder="Guess Number between 1-100"
      />

      <button id="guessBtn">Play</button>
      <button id="reset">Restart</button>
      <p id="message"></p>
      <p>Attempts Remaining: <span id="attempts">0</span></p>
      <p>Score: <span id="highScore"></span></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
